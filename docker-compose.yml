services:
  openreason:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      # ── Bearer token for incoming API requests ────────────────────────────
      OPENREASON_API_KEY: ${OPENREASON_API_KEY}
      # ── Tokaine (OpenAI-compatible) ───────────────────────────────────────
      LLM_PROVIDER: ${LLM_PROVIDER:-tokaine}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-qwen-flagship}
      LLM_SIMPLE_MODEL: ${LLM_SIMPLE_MODEL:-qwen-flagship}
      LLM_COMPLEX_MODEL: ${LLM_COMPLEX_MODEL:-qwen-flagship-deep}
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
